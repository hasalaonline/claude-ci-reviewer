name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and fork PRs (GitHub doesn't give forks your secrets).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The review rules live in the team's central skills repo, not in this one.
      - uses: actions/checkout@v4
        with:
          repository: hasalaonline/claude-team-skills
          path: .team-skills
          # ref: v1.2.0                             # pin a tag, or leave out to follow main
          # token: ${{ secrets.SKILLS_REPO_TOKEN }} # only if the skills repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Ask Claude for a review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/team-standards:pr-review" \
            --plugin-dir "$GITHUB_WORKSPACE/.team-skills/plugins/team-standards" \
            --model sonnet \
            --tools "Read,Grep,Glob" \
            --max-turns 10 \
            --output-format json \
            --json-schema "$(cat .github/claude/review-schema.json)" \
            > review.json

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/claude/post-review.sh
